name: KOA Cabin Watch

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs under load; that is normal.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

permissions:
  contents: write # needed to commit state.json back so it does not re-alert

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: koa-cabin-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run check
        env:
          START_URL: ${{ secrets.START_URL }}
          ARRIVAL: ${{ secrets.ARRIVAL }}
          DEPARTURE: ${{ secrets.DEPARTURE }}
          ADULTS: ${{ secrets.ADULTS }}
          KIDS: ${{ secrets.KIDS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: npm run check

      - name: Save debug screenshots + html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            last-run-step1.png
            last-run-step1.html
            last-run-step2.png
            last-run-step2.html
            last-run-step2.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Persist state
        if: always()
        run: |
          git config user.name "koa-cabin-watch"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git commit -m "update state" || echo "no change"
          git push || echo "nothing to push"
